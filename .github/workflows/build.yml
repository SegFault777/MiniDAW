name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to upload release assets when a tag is pushed

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/MiniDAW | Out-Null
          Copy-Item build/MiniDAW.exe dist/MiniDAW/
          windeployqt --release --no-translations --no-system-d3d-compiler dist/MiniDAW/MiniDAW.exe
          Compress-Archive -Path dist/MiniDAW -DestinationPath MiniDAW-windows-x64-portable.zip -Force

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) } else { $v = '0.2-dev' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer/MiniDAW.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MiniDAW-installer
          path: installer-out/*.exe

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: MiniDAW-portable
          path: MiniDAW-windows-x64-portable.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer-out/*.exe
            MiniDAW-windows-x64-portable.zip
